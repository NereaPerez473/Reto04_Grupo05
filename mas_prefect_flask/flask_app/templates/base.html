<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Microgrid Dashboard{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow" style="background:#0a1628">
        <div class="container-fluid px-4">
            <a class="navbar-brand fw-bold letter-spacing-1" href="/training" style="color:#5b9bd5;font-size:1rem;letter-spacing:.04em">
                Microgrid Multi-Agent Training
            </a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <span class="text-white-50" style="font-size:.78rem">Q-Learning SMA</span>
                <a id="prefect-nav-btn"
                   href="http://localhost:4200/runs"
                   target="_blank"
                   title="Open Prefect UI"
                   style="display:inline-flex;align-items:center;gap:.35rem;
                          background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
                          border-radius:5px;padding:.2rem .7rem;font-size:.75rem;
                          color:#c8d8f0;text-decoration:none;transition:background .2s"
                   onmouseover="this.style.background='rgba(255,255,255,.18)'"
                   onmouseout="this.style.background='rgba(255,255,255,.08)'">
                    <!-- Prefect logo mark -->
                    <svg width="14" height="14" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="16" cy="16" r="16" fill="#6366f1"/>
                        <path d="M10 22V10l12 6-12 6z" fill="#fff"/>
                    </svg>
                    Prefect UI
                </a>
            </div>
        </div>
    </nav>

    <!-- CONTENIDO -->
    <div class="container-fluid px-4 mt-3">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
