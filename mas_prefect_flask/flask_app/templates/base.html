<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
            Microgrid Dashboard
        {% endblock %}
    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- CSS propio -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold"
               href="/">

                ⚡ Microgrid SMA

            </a>

            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse"
                 id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/">

                            Dashboard

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/competitive">

                            Competitive

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/cooperative">

                            Cooperative

                        </a>

                    </li>

                    <li class="nav-item">

                        <a class="nav-link"
                           href="/negotiation">

                            Negotiation

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- CONTENIDO -->

    <div class="container-fluid mt-4">

        {% block content %}
        {% endblock %}

    </div>

    <!-- Bootstrap JS -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
