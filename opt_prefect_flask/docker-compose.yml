services:

  # ------------------------------------------------------------------ #
  # 1. Servidor Prefect — UI de monitorización en http://localhost:4200  #
  # ------------------------------------------------------------------ #
  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect_server_sqlite
    restart: always
    entrypoint: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      - PREFECT_API_DATABASE_CONNECTION_URL=sqlite+aiosqlite:////root/.prefect/prefect.db
    ports:
      - "4200:4200"
    volumes:
      - prefect_data:/root/.prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------------ #
  # 2. Worker manual (one-shot) — solo arranca con:                     #
  #    docker compose --profile manual run --rm pipeline-worker         #
  #    Útil para forzar un run puntual sin el scheduler continuo.       #
  # ------------------------------------------------------------------ #
  pipeline-worker:
    build: .
    container_name: pipeline_worker
    profiles: [manual]
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - APP_DIR=/app
      - PYTHONPATH=/app:/app/models:/app/optimizacion
      - MPLBACKEND=Agg
    command: python pipeline/flow.py
    volumes:
      - ../data:/app/data
      - ../models:/app/models:ro
      - ../optimizacion:/app/optimizacion
    restart: "no"

  # ------------------------------------------------------------------ #
  # 3. Scheduler — lanza el pipeline cada 2 min con ventana deslizante  #
  #    Avanza 24 h por ejecución; guarda estado en data/pipeline_state  #
  # ------------------------------------------------------------------ #
  scheduler:
    build: .
    container_name: pipeline_scheduler
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      - PREFECT_API_URL=http://prefect-server:4200/api
      - APP_DIR=/app
      - PYTHONPATH=/app:/app/models:/app/optimizacion
      - MPLBACKEND=Agg
      - SCHEDULER_INTERVAL=120
      - WINDOW_HOURS=24
    command: python pipeline/scheduler.py
    volumes:
      - ../data:/app/data
      - ../models:/app/models:ro
      - ../optimizacion:/app/optimizacion
    restart: unless-stopped

  # ------------------------------------------------------------------ #
  # 4. Flask API — consulta persistente de resultados                   #
  #    http://localhost:5000/api/optuna/studies                         #
  #    http://localhost:5000/api/results/predicciones/eolico            #
  # ------------------------------------------------------------------ #
  flask-api:
    build: .
    container_name: flask_api
    restart: always
    environment:
      - DATA_DIR=/app/data
      - OPTUNA_DB=/app/optimizacion/optuna_microred.db
      - PYTHONPATH=/app:/app/models:/app/optimizacion
    command: python flask_api/app.py
    ports:
      - "5000:5000"
    volumes:
      # Solo lectura: la API no modifica los datos
      - ../data:/app/data:ro
      - ../optimizacion:/app/optimizacion:ro

volumes:
  prefect_data:
